<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>潜水艦人狼</title>
<style>
:root{--bg:#0b1722;--panel:#12263a;--line:#27465f;--text:#e6f1fa;--dim:#8fa9bd;--acc:#3fd0c9;--warn:#ff8a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;position:relative;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.pri{background:var(--acc);color:#04202a;border-color:var(--acc);font-weight:700}
input{font:inherit;color:var(--text);background:#0b1b2a;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;-webkit-user-select:text;user-select:text}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.screen{position:absolute;inset:0}
#join{display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;touch-action:pan-y}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px}
h1{margin:0;font-size:22px;text-align:center;letter-spacing:.08em}
#pv{justify-self:center}
.sw{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.sw button{aspect-ratio:1;padding:0;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.row{display:flex;gap:8px}.row input{flex:1}
.cl{display:flex;flex-wrap:wrap;gap:6px}
.cl span{background:#0b1b2a;border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;font-size:13px;color:var(--acc)}
.cl button{padding:0 6px;border:none;background:none;color:var(--dim);font-size:14px}
.msg{margin:0;min-height:1.5em;color:var(--warn);font-size:13px;text-align:center}
#stage,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;display:flex;gap:8px;align-items:center;z-index:6}
.tl{left:10px}.tr{right:10px}
.hud button{background:rgba(18,38,58,.92)}
#cnt{color:var(--dim);font-size:13px}
#badge{background:var(--warn);color:#2a0b07;border-radius:9px;padding:0 6px;font-size:12px;font-style:normal;margin-left:6px}
#status{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font-size:12px;color:var(--dim);background:rgba(11,23,34,.8);padding:2px 10px;border-radius:10px;pointer-events:none;white-space:nowrap;z-index:6}
.start{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:6}
.act{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:7}
.act button{min-width:130px;padding:12px 16px;font-weight:700;background:rgba(18,38,58,.92)}
#kb{border-color:#ef4444;color:#ffd5d5}
#rb{border-color:#fbbf24;color:#fff3c4}
#eb{border-color:#60a5fa;color:#dbeafe}
#vote{position:absolute;left:12px;top:60px;width:min(270px,calc(100% - 24px));max-height:70%;overflow:auto;background:rgba(18,38,58,.96);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;z-index:9}
.vh{font-size:13px;color:var(--dim);text-align:center}
.vb{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px}
.vb.on{border-color:#fbbf24;color:#fbbf24}
#chat{position:absolute;right:0;top:56px;bottom:0;width:min(340px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
#chat header{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px}
#log{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#log div{word-break:break-word;font-size:14px}
#log b{margin-right:6px}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.cin input{flex:1}
#role{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(5,10,16,.9);text-align:center;pointer-events:none;padding:20px}
#role b{font-size:clamp(28px,6vw,44px);letter-spacing:.08em}
#role span,#role small{color:var(--dim);font-size:14px}
.tk{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(18,38,58,.92);border:1px solid var(--line);border-radius:12px;padding:6px 14px;text-align:center;min-width:200px;pointer-events:none}
#clk{color:#fde68a;font-size:18px}
.bar{height:6px;background:#0b1b2a;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.tp{font-size:12px;color:var(--dim);margin-top:2px}
.tn{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);z-index:6;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#mg{position:absolute;inset:0;z-index:10;background:rgba(5,10,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.mgc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(360px,100%);display:grid;gap:12px;text-align:center}
.mgt{font-weight:700;font-size:17px;color:var(--acc)}
.mgs{font-size:13px;color:var(--dim);min-height:1.4em}
.mgb{display:grid;gap:10px}
.mggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mgn{padding:16px;font-size:18px;font-weight:700}
.mgn.ok{background:#14532d;border-color:#22c55e;color:#dcfce7}
.mgh{padding:22px;font-size:16px}
.mgsl{position:relative;height:22px;background:#0b1b2a;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mgz{position:absolute;top:0;bottom:0;background:rgba(34,197,94,.55)}
.mgk{position:absolute;top:0;bottom:0;width:3px;background:#fff}
.mgr{width:100%}
.mglamp{height:64px;border-radius:50%;border:2px solid #0b1722;transition:opacity .15s}
.mgtg{font-weight:700;color:#fde68a}
.mgpair{display:grid;grid-template-columns:1fr 1fr;gap:24px;justify-items:center}
.mgcol{display:grid;gap:14px}
.mgdot{width:56px;height:56px;border-radius:50%;border:3px solid #0b1722;padding:0}
.mgdot.on{outline:3px solid #fff;outline-offset:2px}
.mgdot.ok{opacity:.3}
.mgodd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgodc{padding:14px 0;font-size:22px;color:#8fd3ff}
.mm{position:absolute;right:12px;bottom:14px;z-index:4;background:rgba(10,20,32,.9);border:1px solid var(--line);border-radius:12px;padding:6px;pointer-events:none;text-align:center}
.mm canvas{display:block;border-radius:8px}
.mmn{font-size:11px;color:var(--dim);margin-top:4px}
.sb{margin-top:4px;font-size:12px;font-weight:700;color:#fecaca;background:rgba(127,29,29,.6);border-radius:6px;padding:2px 8px}
#sabm{display:flex;flex-direction:column;gap:6px}
#sabm button{min-width:130px;padding:8px 12px;font-size:13px;border-color:#ef4444;color:#ffd5d5}
#sbb{border-color:#ef4444;color:#ffd5d5}
#vb,#vn{border-color:#a78bfa;color:#ede9fe}
#fb{border-color:#f87171;color:#fee2e2}
.hud{z-index:8}
#chat{z-index:8}
#vote{inset:0;width:auto;max-height:none;background:rgba(6,12,20,.97);border:none;border-radius:0;padding:64px 14px 16px;gap:12px;z-index:7;touch-action:pan-y}
.vtt{font-size:18px;font-weight:700;text-align:center}
.vsub{font-size:12px;color:var(--dim);text-align:center}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;align-content:start}
.vc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;border-radius:12px}
.vc.on{border-color:#fbbf24;background:rgba(251,191,36,.14)}
.vc.dd{opacity:.4}
.vn{font-size:14px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbd{position:absolute;top:6px;right:6px;font-size:11px;background:#14532d;color:#dcfce7;border-radius:8px;padding:0 6px}
.vs{position:sticky;bottom:0;margin-top:auto;padding:14px;font-size:16px;font-weight:700}
.vs.on{border-color:#fbbf24;color:#fbbf24}
#cfg{position:absolute;inset:0;z-index:7;background:rgba(6,12,20,.97);padding:64px 14px 16px;overflow:auto;touch-action:pan-y}
.cfc{max-width:520px;margin:0 auto;display:grid;gap:12px}
.cft{font-size:18px;font-weight:700;text-align:center}
.cfn{font-size:12px;color:var(--dim);text-align:center}
.cfr{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.cfh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cfh b{color:var(--acc);white-space:nowrap}
.cfr input[type=range]{width:100%}
.cfr button{justify-self:end;min-width:80px}
</style>
</head>
<body>
<div id="join" class="screen">
 <div class="card">
  <h1>潜水艦人狼</h1>
  <canvas id="pv" width="190" height="130"></canvas>
  <input id="nm" maxlength="12" placeholder="名前" autocomplete="off">
  <div id="sw" class="sw"></div>
  <div class="row"><input id="cc" placeholder="コスチュームコード" maxlength="16" autocapitalize="off" autocomplete="off"><button id="ca">使う</button></div>
  <div id="cl" class="cl" hidden></div>
  <button id="mk" class="pri">ルームを作成</button>
  <div class="row"><input id="rid" maxlength="12" placeholder="ルームID" autocapitalize="off" autocomplete="off"><button id="jn">入室</button></div>
  <p id="msg" class="msg"></p>
 </div>
</div>
<div id="game" class="screen" hidden>
 <div id="stage"><canvas id="cv"></canvas></div>
 <div class="hud tl"><button id="rc">ルームID <b id="rcode"></b></button><span id="cnt"></span><button id="lv">退出</button></div>
 <div class="hud tr"><button id="cfgBtn" hidden>設定</button><button id="mmBtn" hidden>マップ(M)</button><button id="chatBtn">チャット<i id="badge" hidden></i></button></div>
 <div id="status" hidden></div>
 <div id="act" class="act" hidden><button id="sbb" hidden>サボタージュ(G)</button><div id="sabm" hidden><button data-t="reactor">原子炉冷却停止</button><button data-t="comm">通信妨害</button><button data-t="light">停電</button></div><button id="fb" hidden>復旧(F)</button><button id="vn" hidden>次のベント(C)</button><button id="vb" hidden>ベント(V)</button><button id="tb" hidden>タスク(T)</button><button id="eb" hidden>緊急会議</button><button id="rb" hidden>通報</button><button id="kb" hidden>キル</button></div>
 <div id="vote" hidden></div>
 <div id="cfg" hidden></div>
 <select id="tn" class="tn" hidden><option value="3">タスク3個</option><option value="5" selected>タスク5個</option><option value="8">タスク8個</option></select>
 <button id="start" class="start" disabled hidden>ゲーム開始</button>
 <aside id="chat" hidden>
  <header>チャット(ロビー・会議中のみ)</header>
  <div id="log"></div>
  <div class="cin"><input id="ci" maxlength="120" placeholder="メッセージ" autocomplete="off"><button id="cs">送信</button></div>
 </aside>
 <div id="role" hidden><small id="rk"></small><b id="rl"></b><span id="rm"></span></div>
 <div id="tk" class="tk" hidden><div>修理部隊まで <b id="clk">100</b></div><div id="bw" class="bar"><i id="bf"></i></div><div id="tp" class="tp"></div><div id="sb" class="sb" hidden></div></div>
 <div id="mm" class="mm" hidden><canvas id="mmc"></canvas><div class="mmn">● 自分　◎ 未完了のタスク</div></div>
 <div id="mg" hidden><div class="mgc"><div id="mgt" class="mgt"></div><div id="mgb" class="mgb"></div><div id="mgs" class="mgs"></div><button id="mgx">やめる</button></div></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const CTRL=/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g;
// 地図の広さ: 面積を3倍(縦横それぞれ約1.73倍)。この数字を変えると広さが変わります
const SC=1.732,MW=1940,MH=1500,WW=MW*SC,WH=MH*SC;
const CAFX=1160,CAFY=200,TX=CAFX*SC,TY=CAFY*SC,TR=42*SC;
const MAX=20,KR=95,RR=110,ER=120,EM_CD=30000,RES_MS=6000;
let SPEED=190,KILL_CD=25000,MEET_MS=60000;
const COLORS=['#e5484d','#3b82f6','#22c55e','#facc15','#f97316','#a855f7','#ec4899','#14b8a6','#94a3b8','#8b5a2b','#f5f5f4','#3a4a5c','#f9a8d4','#a3e635','#22d3ee','#9f1239','#166534','#c4b5fd','#fdba74','#1e40af'];
const ROOMS=[['上機関室',60,80,260,200],['医務室',520,110,200,180],['食堂',960,60,400,280],['魚雷室',1600,80,240,200],['空気浄化室',1620,500,200,140],['発令所',1640,890,180,220],['ダメコン室',1240,830,180,160],['通信室',840,900,200,140],['倉庫',420,860,200,300],['海図室',960,600,220,160],['配電室',20,820,200,200],['下機関室',20,1230,260,200],['原子炉室',20,500,180,200],['監視室',420,500,160,120]];
const LINKS=[[0,1,'h'],[1,2,'h'],[2,3,'h'],[3,4,'v'],[4,5,'v'],[5,6,'h'],[6,7,'h'],[7,8,'h'],[8,10,'h'],[10,11,'v'],[0,12,'v'],[12,13,'h'],[13,8,'v'],[2,9,'v'],[9,7,'v'],[1,13,'v']];
const HALLS=LINKS.map(([a,b,o])=>{
const A=ROOMS[a],B=ROOMS[b];
if(o==='h'){
const l=A[1]+A[3]<=B[1]?A:B,r=l===A?B:A;
const y0=Math.max(l[2],r[2]),y1=Math.min(l[2]+l[4],r[2]+r[4]),th=Math.min(70,y1-y0),cy=(y0+y1)/2;
return [l[1]+l[3],cy-th/2,r[1]-(l[1]+l[3]),th];
}
const tp=A[2]+A[4]<=B[2]?A:B,bm=tp===A?B:A;
const x0=Math.max(tp[1],bm[1]),x1=Math.min(tp[1]+tp[3],bm[1]+bm[3]),th=Math.min(70,x1-x0),cx=(x0+x1)/2;
return [cx-th/2,tp[2]+tp[4],th,bm[2]-(tp[2]+tp[4])];
});
const RECTS=ROOMS.map(r=>r.slice(1)).concat(HALLS);
const COSTUMES={ice:{n:'アイス',s:'head'},hurt:{n:'ハート',s:'head'},devil:{n:'デビル',s:'back'},ufo:{n:'UFO',s:'pet'},tablet:{n:'タブレット',s:'pet'},pain:{n:'パイナップル',s:'pet'},yasuimonda:{n:'左腕',s:'arm'},roger:{n:'海賊王の帽子',s:'head'},newgate:{n:'白ひげのヒゲ',s:'face'}};
const COSTUME_ALIAS={chilly:'ice'};
function cleanCs(a){const o=[];if(!Array.isArray(a))return o;for(const k of a){if(typeof k==='string'&&Object.prototype.hasOwnProperty.call(COSTUMES,k)){const i=o.findIndex(x=>COSTUMES[x].s===COSTUMES[k].s);if(i>=0)o.splice(i,1);o.push(k);}}return o.slice(0,5);}
const CFG_DEF={spies:0,tasks:5,time:15,boost:4,killcd:25,speed:100,visC:100,visS:100,meet:60,sabo:1,vent:1};
const CFG_RNG={spies:[0,4],tasks:[1,8],time:[5,30],boost:[1,8],killcd:[10,60],speed:[70,150],visC:[50,150],visS:[50,150],meet:[30,120],sabo:[0,1],vent:[0,1]};
function cleanCfg(o){const r={};o=o&&typeof o==='object'?o:{};for(const k in CFG_DEF){const v=Number(o[k]),g=CFG_RNG[k];r[k]=Number.isFinite(v)?Math.min(g[1],Math.max(g[0],Math.round(v))):CFG_DEF[k];}return r;}
let CFG=cleanCfg({});
const me={x:TX+120*SC,y:TY+70*SC,f:1,name:'',color:COLORS[0],mv:false,cs:[]};
const keys={},others=new Map();
const cv=$('cv'),c=cv.getContext('2d'),stage=$('stage');
let R=null,offChat=null,code='',host=false,phase='lobby',role='',unread=0,chatOpen=false,t=0,D=1,stick=null,sent={},sentAt=0,flashUntil=0,actT=0,bigT=0;
let ids=[],spyIds=[],dead=new Set(),bodies=[],meeting=null,resultUntil=0,pendingWin=null,killCd=0,emCd=0,myVote=null;
let taskN=5,myTasks=[],myDone=new Set(),doneBy=new Map(),clkV=100,clkHost=100,lastClk=0,mgIdx=null,mgCleanup=null;
let sabo=null,sabCd=0,inVent=-1,sabMenu=false,pvT=0,cfgOpen=false;
const gratePat=(()=>{const p=document.createElement('canvas');p.width=p.height=12;const g=p.getContext('2d');g.strokeStyle='#3d4d60';g.lineWidth=2;g.beginPath();g.moveTo(0,12);g.lineTo(12,0);g.stroke();return c.createPattern(p,'repeat');})();
const hazPat=(()=>{const p=document.createElement('canvas');p.width=p.height=16;const g=p.getContext('2d');g.fillStyle='#d9a521';g.fillRect(0,0,16,16);g.strokeStyle='#161616';g.lineWidth=6;g.beginPath();g.moveTo(0,8);g.lineTo(8,0);g.moveTo(8,16);g.lineTo(16,8);g.stroke();return c.createPattern(p,'repeat');})();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clean=s=>typeof s==='string'?s.replace(CTRL,'').slice(0,12):'';
const okCol=s=>typeof s==='string'&&/^#[0-9a-f]{6}$/i.test(s)?s:'#94a3b8';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,ms){const e=Date.now()+ms;while(Date.now()<e){if(fn())return true;await sleep(100);}return fn();}
const msg=s=>{$('msg').textContent=s||'';};
function setStatus(s){const e=$('status');e.textContent=s;e.hidden=!s;}
function flash(s){flashUntil=Date.now()+2500;setStatus(s);}
function save(){try{localStorage.setItem('subwolf',JSON.stringify({n:me.name,c:me.color,k:me.cs,g:CFG}));}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('subwolf')||'{}');if(typeof s.n==='string')$('nm').value=s.n.slice(0,12);if(COLORS.includes(s.c))me.color=s.c;if(Array.isArray(s.k))me.cs=cleanCs(s.k);if(s.g&&typeof s.g==='object')CFG=cleanCfg(s.g);}catch(e){}
const online=()=>!R||typeof R.connected!=='function'||R.connected();
const P=(x,y)=>{const u=x/SC,v=y/SC,L=phase==='lobby'?[ROOMS[2].slice(1)]:RECTS;return L.some(r=>u>=r[0]&&u<=r[0]+r[2]&&v>=r[1]&&v<=r[1]+r[3]);};
const ok=(x,y)=>P(x-12,y)&&P(x+12,y)&&P(x,y-8)&&P(x,y+6)&&Math.hypot(x-TX,y-TY)>TR;
const selfPeer=()=>{const p=R?R.peers().find(q=>q.sameTab):null;return p?p.peer:null;};
const amDead=()=>{const s=selfPeer();return !!s&&dead.has(s);};
const nameOf=id=>{const p=R?R.peers().find(q=>q.peer===id):null;return p&&p.presence?(clean(p.presence.n)||'?'):'?';};
const isHost=id=>{const p=R?R.peers().find(q=>q.peer===id):null;return !!(p&&p.presence&&p.presence.h===1);};
const frozen=()=>phase==='meeting'||phase==='result'||phase==='over'||mgIdx!==null||inVent>=0;
const canChat=()=>['lobby','meeting','result','over'].includes(phase);
function big(k,title,sub,col,ms){$('rk').textContent=k||'';$('rl').textContent=title||'';$('rl').style.color=col||'#fff';$('rm').textContent=sub||'';$('role').hidden=false;clearTimeout(bigT);bigT=setTimeout(hideBig,ms||3000);}
function hideBig(){$('role').hidden=true;}

/* ---- drawing helpers ---- */
function rr(g,x,y,w,h,rt,rb){g.beginPath();g.moveTo(x+rt,y);g.lineTo(x+w-rt,y);g.quadraticCurveTo(x+w,y,x+w,y+rt);g.lineTo(x+w,y+h-rb);g.quadraticCurveTo(x+w,y+h,x+w-rb,y+h);g.lineTo(x+rb,y+h);g.quadraticCurveTo(x,y+h,x,y+h-rb);g.lineTo(x,y+rt);g.quadraticCurveTo(x,y,x+rt,y);g.closePath();}
function mix(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const to=k<0?0:255,a=Math.abs(k);r=Math.round(r+(to-r)*a);g=Math.round(g+(to-g)*a);b=Math.round(b+(to-b)*a);return 'rgb('+r+','+g+','+b+')';}
function petOf(cs){return (cs&&cs.find(k=>COSTUMES[k]&&COSTUMES[k].s==='pet'))||null;}
function stepPet(p,ox,oy,f,dt){
  const tx=ox-f*38,ty=oy+4,d=Math.hypot(tx-p.x,ty-p.y);
  if(d>420){p.x=tx;p.y=ty;p.mv=false;return;}
  const k=Math.min(1,dt*7);p.x+=(tx-p.x)*k;p.y+=(ty-p.y)*k;p.mv=d>5;
}
function ufoPet(g,x,y,tm){
  const cy=y-50+Math.sin(tm*3)*3;
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,y,10,3.5,0,0,7);g.fill();
  g.fillStyle='rgba(140,255,200,.12)';g.beginPath();g.moveTo(x-6,cy+5);g.lineTo(x+6,cy+5);g.lineTo(x+13,y);g.lineTo(x-13,y);g.closePath();g.fill();
  g.fillStyle='rgba(170,235,255,.9)';g.beginPath();g.ellipse(x,cy-2,7,6,0,Math.PI,0);g.fill();
  g.fillStyle='#9aa8b8';g.beginPath();g.ellipse(x,cy+1,14,5,0,0,7);g.fill();g.lineWidth=1.2;g.strokeStyle='#5b6a7c';g.stroke();
  for(let k=-1;k<=1;k++){g.fillStyle=((Math.floor(tm*4)+k+3)%2===0)?'#fde047':'#fb7185';g.beginPath();g.arc(x+k*7,cy+1.5,1.7,0,7);g.fill();}
}
function tabletPet(g,x,y,tm){

  rr(g,-10,-14,20,28,3,3);g.fillStyle='#2a3340';g.fill();g.lineWidth=1.5;g.strokeStyle='#aeb9c6';g.stroke();
  g.fillStyle='#f4f8fb';g.fillRect(-8,-11.5,16,21);
  g.fillStyle='#e11d48';g.beginPath();g.arc(-2.2,-1,3.8,0,7);g.fill();g.beginPath();g.arc(2.2,-1,3.8,0,7);g.fill();g.beginPath();g.arc(0,1.6,3.8,0,7);g.fill();

function pinePet(g,x,y,tm,mv){

  g.beginPath();g.moveTo(x-4,cy+9);g.lineTo(x-4+s*3,y-1);g.moveTo(x+4,cy+9);g.lineTo(x+4-s*3,y-1);g.stroke();g.lineCap='butt';
  g.fillStyle='#6b4410';g.beginPath();g.ellipse(x-4+s*3,y,3,1.6,0,0,7);g.fill();g.beginPath();g.ellipse(x+4-s*3,y,3,1.6,0,0,7);g.fill();
  g.fillStyle='#f6b400';g.beginPath();g.ellipse(x,cy,9,11,0,0,7);g.fill();g.lineWidth=1.2;g.strokeStyle='#b97a00';g.stroke();
  g.save();g.beginPath();g.ellipse(x,cy,9,11,0,0,7);g.clip();g.strokeStyle='rgba(140,80,0,.55)';g.lineWidth=1;g.beginPath();

  g.stroke();g.restore();

  for(let i=-2;i<=2;i++){const bx=x+i*3.2,by=cy-9.5,tx=x+i*4.4+Math.sin(tm*3+i)*1.2,ty=by-(10-Math.abs(i)*2);g.beginPath();g.moveTo(bx-2.4,by);g.lineTo(tx,ty);g.lineTo(bx+2.4,by);g.closePath();g.fill();}
}
function drawPet(g,o){if(o.pet==='ufo')ufoPet(g,o.x,o.y,t);else if(o.pet==='tablet')tabletPet(g,o.x,o.y,t);else pinePet(g,o.x,o.y,t,o.mv);}

function wings(g,tm,mv){

function iceCube(g,tm){

function heartHat(g,tm){

function slime(g,x,y,col,name,tm,mv,f,self,cs){

  g.save();g.translate(x,y);g.scale(1-q,1+q);if(cs&&cs.includes('devil'))wings(g,tm,mv);
  rr(g,-w/2,-h,w,h,15,7);g.fillStyle=col;g.fill();g.lineWidth=2;g.strokeStyle='rgba(230,241,250,.4)';g.stroke();
  g.save();g.clip();g.fillStyle=mix(col,-.3);g.fillRect(-w/2,-14,w,14);g.fillStyle=mix(col,.4);g.fillRect(-w/2+4,-h+8,4,20);g.restore();

function seams(x,y,w,h){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.strokeStyle='#263241';c.lineWidth=1;c.beginPath();for(let i=x;i<=x+w;i+=40){c.moveTo(i,y);c.lineTo(i,y+h);}for(let j=y;j<=y+h;j+=40){c.moveTo(x,j);c.lineTo(x+w,j);}c.stroke();c.restore();}

function wheel(x,y,r){c.strokeStyle='#8a9aab';c.lineWidth=3;c.beginPath();c.arc(x,y,r,0,7);c.stroke();c.beginPath();for(let k=0;k<4;k++){c.moveTo(x,y);c.lineTo(x+Math.cos(k*1.571)*r,y+Math.sin(k*1.571)*r);}c.stroke();}

function floor(){

  c.fillStyle='#1c2634';HL.forEach(r=>c.fillRect(r[0],r[1],r[2],r[3]));

function onEv(m){
  const d=m.data||{},from=m.peer,mine=selfPeer();
  if(d.k==='start'){
    if(!isHost(from)||!Array.isArray(d.ids)||!Array.isArray(d.spies))return;
    CFG=cleanCfg(d.cfg);applyCfg();ids=d.ids.slice(0,MAX).map(String);spyIds=d.spies.slice(0,MAX).map(String);
    dead=new Set();bodies=[];meeting=null;pendingWin=null;myVote=null;killCd=Date.now()+KILL_CD;emCd=0;sabo=null;inVent=-1;sabCd=Date.now()+15000;
    const i=ids.indexOf(mine);
    role=i<0?'spec':spyIds.includes(mine)?'spy':'crew';
    phase='play';
    if(i>=0){const a=6.2832*i/ids.length;me.x=TX+Math.cos(a)*110*SC;me.y=TY+Math.sin(a)*80*SC;}
    sent={};
    $('chat').hidden=true;chatOpen=false;
    initTasks(CFG.tasks);
    const partners=spyIds.filter(x=>x!==mine).map(id=>nameOf(id)).join('、');
    const rn=role==='spy'?'スパイ':role==='crew'?'クルー':'観戦';
    const desc=role==='spy'?(partners?'仲間: '+partners:'あなたが唯一のスパイです'):role==='crew'?'タスクをこなして、スパイを見つけ出そう':'';
    big('あなたの役職',rn,desc,role==='spy'?'#ff6b6b':'#3fd0c9',4000);
  }
  else if(d.k==='reset'){
    if(!isHost(from))return;
    phase='lobby';role='';ids=[];spyIds=[];dead=new Set();bodies=[];meeting=null;pendingWin=null;myVote=null;
    closeMG();hideBig();$('vote').hidden=true;sabo=null;inVent=-1;
    const a=Math.random()*6.2832;me.x=TX+Math.cos(a)*120*SC;me.y=TY+Math.sin(a)*70*SC;sent={};
  }
  else if(d.k==='kill'){
    if(phase!=='play'||!spyIds.includes(from)||dead.has(from)||!ids.includes(d.v)||spyIds.includes(d.v)||dead.has(d.v))return;
    dead.add(d.v);
    bodies.push({id:typeof d.b==='string'?d.b.slice(0,40):'b'+Date.now(),x:clamp(+d.x||0,0,WW),y:clamp(+d.y||0,0,WH),c:okCol(d.c)});
    if(d.v===mine)big('キルされました','ゴーストになりました','死体を通報するか、生存者の様子を見守ろう','#94a3b8',4000);
    const w=winner();if(w)endGame(w);
  }
  else if(d.k==='meet'){
    if(phase!=='play'||!ids.includes(from))return;
    if(d.b==null){if(dead.has(from)||(sabo&&sabo.type==='reactor'))return;startMeeting('button',from);return;}
    if(!bodies.some(b=>b.id===d.b))return;
    startMeeting('report',from);
  }
  else if(d.k==='vote'){
    if(phase!=='meeting'||!meeting||!ids.includes(from)||dead.has(from))return;
    if(!(d.to==='skip'||(typeof d.to==='string'&&ids.includes(d.to)&&!dead.has(d.to)&&d.to!==from)))return;
    meeting.votes.set(from,d.to);
    if(from===mine)myVote=d.to;
    renderVote();
    if(host&&!meeting.done&&ids.filter(id=>!dead.has(id)).every(id=>meeting.votes.has(id)))tally();
  }
  else if(d.k==='cnt'){
    if(!isHost(from)||phase==='lobby')return;
    if(typeof d.v==='number')clkV=d.v;
  }
  else if(d.k==='done'){
    if(phase==='lobby'||spyIds.includes(from)||!ids.includes(from)||typeof d.s!=='number'||d.s<0||d.s>=STATIONS.length)return;

  }
  else if(d.k==='end'){

    endGame(d.w==='spy'?'spy':'crew');
  }
  else if(d.k==='sab'){
    if(phase!=='play'||!CFG.sabo||sabo||!spyIds.includes(from)||dead.has(from)||!['reactor','comm','light'].includes(d.t))return;
    sabo={type:d.t,end:d.t==='reactor'?Date.now()+SAB_REACTOR:0};
    flash('サボタージュ発生：'+SABN[d.t]);
  }
  else if(d.k==='fix'){
    if(!sabo||phase!=='play'||spyIds.includes(from)||!ids.includes(from)||dead.has(from))return;
    sabo=null;sabCd=Date.now()+SAB_CD;flash('復旧しました');
  }
  else if(d.k==='result'){
    if(phase!=='meeting'||!isHost(from))return;
    const out=typeof d.out==='string'&&ids.includes(d.out)&&!dead.has(d.out)?d.out:null;
    if(out)dead.add(out);
    const orole=out?(spyIds.includes(out)?'スパイ':'クルー'):'';
    phase='result';resultUntil=Date.now()+RES_MS;myVote=null;meeting=null;$('vote').hidden=true;
    pendingWin=winner();
    big('会議の結果',out?nameOf(out)+' を追放':'追放なし',out?(out===mine?'あなたは追放されました（役職: '+orole+'）':'役職は'+orole+'でした'):'票が割れたため、誰も追放されません',out===mine?'#ff6b6b':'#fbbf24',RES_MS-1000);
  }

function buildHold(box,s){
const bar=document.createElement('div');bar.className='bar';
const fill=document.createElement('i');bar.appendChild(fill);
const b=document.createElement('button');b.className='pri mgh';b.textContent='準備完了';
$('mgs').textContent='ボタンを押し続けてください';
let p=0,down=false,last=performance.now(),raf=0;
const step=now=>{
const dt=(now-last)/1000;last=now;
p=clamp(p+(down?dt/s.p:-dt/(s.p*2)),0,1);
fill.style.width=(p*100)+'%';
if(p>=1){mgDone();return;}
if(!down&&p<=0){raf=0;return;}
raf=requestAnimationFrame(step);
};
const start=e=>{e.preventDefault();if(down)return;down=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(step);};
const stop=()=>{down=false;};
b.addEventListener('pointerdown',start);
b.addEventListener('pointerup',stop);
b.addEventListener('pointerleave',stop);
b.addEventListener('pointercancel',stop);
mgCleanup=()=>cancelAnimationFrame(raf);
box.append(bar,b);
}
function buildSeq(box,s){

const grid=document.createElement('div');grid.className='mggrid';
order.forEach(v=>{
const b=document.createElement('button');b.className='mgn';b.textContent=String(v);

function buildMemo(box,s){
  const cols=['#ef4444','#22c55e','#3b82f6','#facc15'],seq=[Math.random()*4|0,Math.random()*4|0,Math.random()*4|0];
  const grid=document.createElement('div');grid.className='mggrid';
  const lamps=cols.map((col,i)=>{const b=document.createElement('button');b.className='mglamp';b.style.background=col;b.style.opacity='.3';b.onclick=()=>press(i);grid.appendChild(b);return b;});
  box.appendChild(grid);
  const tms=[];let pos=0,accept=false;
  const later=(fn,ms)=>{tms.push(setTimeout(fn,ms));};
  const glow=(i,ms)=>{lamps[i].style.opacity='1';later(()=>{lamps[i].style.opacity='.3';},ms);};
  function show(){
    accept=false;pos=0;$('mgs').textContent='光る順番を覚えてください';
    seq.forEach((v,k)=>later(()=>glow(v,450),400+k*700));
    later(()=>{accept=true;$('mgs').textContent='同じ順番で押してください';},400+seq.length*700);
  }
  function press(i){
    if(!accept)return;
    glow(i,200);
    if(i===seq[pos]){pos++;if(pos>=seq.length){accept=false;later(mgDone,300);}return;}
    accept=false;$('mgs').textContent='違います。もう一度見てください';
    later(show,900);
  }
  mgCleanup=()=>{tms.forEach(clearTimeout);};
  show();
}
function buildSwitch(box,s){
  let target;do{target=[0,1,2,3].map(()=>Math.random()<.5?1:0);}while(target.every(v=>v===target[0]));
  const st=[0,1,2,3].map(()=>Math.random()<.5?1:0);
  if(st.every((v,i)=>v===target[i]))st[0]=1-st[0];
  const tg=document.createElement('div');tg.className='mgtg';tg.textContent='目標: '+target.map(v=>v?'ON':'OFF').join(' ・ ');
  const row=document.createElement('div');row.className='mggrid';
  const btns=st.map((_,i)=>{const b=document.createElement('button');b.className='mgn';b.onclick=()=>{st[i]=1-st[i];paint();if(st.every((v,k)=>v===target[k]))mgDone();};row.appendChild(b);return b;});
  function paint(){btns.forEach((b,i)=>{b.textContent=(i+1)+': '+(st[i]?'ON':'OFF');b.classList.toggle('ok',!!st[i]);});}
  paint();
  $('mgs').textContent='スイッチを目標と同じ並びにしてください';
  box.append(tg,row);
}
function buildPair(box,s){
  const cols=['#ef4444','#22c55e','#3b82f6'],order=[0,1,2];
  for(let i=2;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]];}
  const done=new Set();let sel=null;
  const wrap=document.createElement('div');wrap.className='mgpair';
  const L=document.createElement('div');L.className='mgcol';
  const Rc=document.createElement('div');Rc.className='mgcol';
  const lefts=cols.map((col,i)=>{const b=document.createElement('button');b.className='mgdot';b.style.background=col;b.onclick=()=>{if(done.has(i))return;sel=i;paint();};L.appendChild(b);return b;});
  const rights=order.map(ci=>{const b=document.createElement('button');b.className='mgdot';b.style.background=cols[ci];b.onclick=()=>{if(sel===null||done.has(ci))return;if(sel===ci){done.add(ci);sel=null;paint();if(done.size===cols.length)mgDone();return;}sel=null;paint();$('mgs').textContent='色が違います。左から選び直してください';};Rc.appendChild(b);return b;});
  function paint(){lefts.forEach((b,i)=>{b.classList.toggle('on',sel===i);b.classList.toggle('ok',done.has(i));b.disabled=done.has(i);});rights.forEach((b,k)=>{const ci=order[k];b.classList.toggle('ok',done.has(ci));b.disabled=done.has(ci);});}
  $('mgs').textContent='左の色を選んで、同じ色を右から押してください';
  wrap.append(L,Rc);box.appendChild(wrap);
  paint();
}

  const v=frozen()?[0,0]:inputVec(),mv=!!(v[0]||v[1]);
  if(mv){
    if(amDead()){me.x=clamp(me.x+v[0]*SPEED*dt,0,WW);me.y=clamp(me.y+v[1]*SPEED*dt,0,WH);}
    else{const nx=me.x+v[0]*SPEED*dt,ny=me.y+v[1]*SPEED*dt;if(ok(nx,ny)){me.x=nx;me.y=ny;}else if(ok(nx,me.y))me.x=nx;else if(ok(me.x,ny))me.y=ny;}
    if(Math.abs(v[0])>.2)me.f=v[0]>0?1:-1;
  }
  me.mv=mv;const pkm=petOf(me.cs);if(pkm){if(!me.pet)me.pet={x:me.x-me.f*38,y:me.y,mv:false};stepPet(me.pet,me.x,me.y,me.f,dt);}
  const s={x:Math.round(me.x),y:Math.round(me.y),f:me.f,mv:mv?1:0,vt:inVent>=0?1:0},n=performance.now();
  if((s.x!==sent.x||s.y!==sent.y||s.f!==sent.f||s.mv!==sent.mv||s.vt!==sent.vt)&&n-sentAt>66){R.presence(s).catch(()=>{});sent=s;sentAt=n;}
  const seen=new Set();
  for(const p of R.peers()){
    const q=p.presence||{};if(p.sameTab||typeof q.x!=='number'||typeof q.y!=='number')continue;
    seen.add(p.peer);let o=others.get(p.peer);if(!o){o={x:q.x,y:q.y};others.set(p.peer,o);}
    o.tx=clamp(q.x,0,WW);o.ty=clamp(q.y,0,WH);o.f=q.f===-1?-1:1;o.mv=q.mv===1;o.n=(q.h===1?'★':'')+clean(q.n);o.c=okCol(q.c);o.vt=q.vt===1;o.cs=cleanCs(q.cs);
  }
  for(const key of others.keys())if(!seen.has(key))others.delete(key);
  const lerp=Math.min(1,dt*14);
  for(const o of others.values()){o.x+=(o.tx-o.x)*lerp;o.y+=(o.ty-o.y)*lerp;const pk=petOf(o.cs);if(pk){if(!o.pet)o.pet={x:o.x-o.f*38,y:o.y,mv:false};stepPet(o.pet,o.x,o.y,o.f,dt);}else o.pet=null;}
}
function tick(){
  if(!R)return;
  const ps=R.peers(),np=ps.filter(p=>p.presence&&p.presence.n).length,now=Date.now();
  if(host)R.presence({ph:phase}).catch(()=>{});
  hostClock(now);updHud();
  if(phase==='meeting'&&host&&meeting&&!meeting.done&&now>=meeting.end)tally();
  if(phase==='meeting'&&meeting)tickVote();
  syncCfg();
  if(phase==='result'&&now>=resultUntil)afterResult();
  if(now>flashUntil){
    if(!online())setStatus(R.dead?'切断されました。退出して入り直してください':'再接続中…');
    else if(phase==='meeting'&&meeting)setStatus('会議中 残り'+Math.max(0,Math.ceil((meeting.end-now)/1000))+'秒');
    else setStatus(ps.some(p=>p.presence&&p.presence.h===1)?'':'ホストがいません');
  }
  $('cnt').textContent=phase==='lobby'?np+'/'+MAX+'人':((role==='spy'?'スパイ':role==='crew'?'クルー':'')+(amDead()?'（ゴースト）':''));
  const st=$('start');st.textContent=phase==='lobby'?'ゲーム開始':'ロビーに戻る';st.disabled=phase==='lobby'&&np<3;
}

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;if(!R&&now-pvT>60){pvT=now;if(!$('join').hidden)paintPv();}
  if(R&&cv.width){update(dt);draw();if(mmOn)drawMinimap();if(now-actT>200){actT=now;updActions();}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(tick,1000);

/* ---- lobby and rooms ---- */
const sw=$('sw');

function paintCl(){

  me.cs.forEach(k=>{const s=document.createElement('span');s.textContent=COSTUMES[k].n+' ';const b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label','外す');b.onclick=()=>{me.cs=me.cs.filter(x=>x!==k);paintCl();paintSw();save();};s.appendChild(b);box.appendChild(s);});

function useCode(){
  const v0=$('cc').value.normalize('NFKC').trim().toLowerCase(),v=Object.prototype.hasOwnProperty.call(COSTUME_ALIAS,v0)?COSTUME_ALIAS[v0]:v0;
  if(!v)return;
  if(!Object.prototype.hasOwnProperty.call(COSTUMES,v)){msg('コスチュームコードが違います');return;}
  me.cs=cleanCs(me.cs.concat(v));$('cc').value='';msg('');paintCl();paintSw();save();
}
$('ca').onclick=useCode;
$('cc').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)useCode();});
paintCl();
const snap=()=>({n:me.name,c:me.color,x:Math.round(me.x),y:Math.round(me.y),f:me.f,mv:0,h:host?1:null,cs:me.cs,cf:host?CFG:null});
/* ---- WebSocket transport (self-hosted) ---- */
function wsJoin(name){
  return new Promise((resolve,reject)=>{
    const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
    const peers=new Map(),subs=new Map(),BAD=['__proto__','constructor','prototype'];
    let ws=null,me=null,token=null,seq=0,left=false,done=false,tries=0,rt=0,to=0,lastRx=Date.now(),cache=null;
    const room={dead:false};
    const merge=(cur,patch)=>{const n=Object.assign({},cur);for(const k in patch){if(BAD.includes(k))continue;if(patch[k]===null)delete n[k];else n[k]=patch[k];}return n;};
    const raw=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));};
    const fail=code=>{if(done)return;done=true;left=true;clearTimeout(to);try{ws.close();}catch(e){}reject({code});};
    room.presence=p=>{peers.set(me,merge(peers.get(me)||{},p));cache=null;raw({t:'pres',patch:p});return Promise.resolve();};
    room.peers=()=>{if(!cache)cache=[...peers].map(([id,pr])=>({peer:id,presence:pr,isMe:id===me,sameTab:id===me}));return cache;};
    room.on=(topic,fn)=>{let s=subs.get(topic);if(!s){s=new Set();subs.set(topic,s);}s.add(fn);return()=>{s.delete(fn);};};
    room.emit=(topic,data)=>{if(!room.connected())return Promise.reject({code:'disconnected'});raw({t:'emit',topic,data});return Promise.resolve();};
    room.connected=()=>!room.dead&&!!ws&&ws.readyState===1;
    room.leave=()=>{left=true;clearTimeout(rt);clearTimeout(to);clearInterval(wd);document.removeEventListener('visibilitychange',vis);try{raw({t:'leave'});if(ws)ws.close();}catch(e){}return Promise.resolve();};
    function onMsg(ev){
      lastRx=Date.now();
      let m;try{m=JSON.parse(ev.data);}catch(e){return;}
      if(m.t==='joined'){
        clearTimeout(to);me=m.you;token=m.token;peers.clear();
        for(const e of m.peers)peers.set(e[0],e[1]||{});
        cache=null;tries=0;
        if(!done){done=true;resolve(room);}
      }
      else if(m.t==='join'){if(!peers.has(m.peer)){peers.set(m.peer,{});cache=null;}}
      else if(m.t==='pres'){peers.set(m.peer,merge(peers.get(m.peer)||{},m.patch||{}));cache=null;}
      else if(m.t==='left'){peers.delete(m.peer);cache=null;}
      else if(m.t==='msg'){
        if(typeof m.s==='number')seq=Math.max(seq,m.s);
        const s=subs.get(m.topic);
        if(s)s.forEach(fn=>{try{fn({topic:m.topic,peer:m.peer,data:m.data,sameTab:m.peer===me,isMe:m.peer===me});}catch(e){console.error(e);}});
      }
      else if(m.t==='err'){
        if(!done)fail(m.code||'error');
        else if(m.code==='no_session'){room.dead=true;left=true;}
      }
    }
    function connect(first){
      try{ws=new WebSocket(url);}catch(e){if(first)fail('connect_failed');else retry();return;}
      if(first){clearTimeout(to);to=setTimeout(()=>fail('connect_failed'),8000);}
      const w=ws;
      w.onopen=()=>{lastRx=Date.now();raw(first?{t:'join',room:name}:{t:'resume',room:name,id:me,token:token,last:seq});};
      w.onmessage=onMsg;
      w.onerror=()=>{};
      w.onclose=()=>{if(w!==ws||left)return;if(!done){fail('connect_failed');return;}cache=null;retry();};
    }
    function retry(){
      if(left)return;
      tries++;
      if(tries>60){room.dead=true;left=true;return;}
      rt=setTimeout(()=>connect(false),Math.min(3000,400*tries));
    }
    const vis=()=>{if(!document.hidden&&!left&&done&&(!ws||ws.readyState>1)){clearTimeout(rt);connect(false);}};
    document.addEventListener('visibilitychange',vis);
    const wd=setInterval(()=>{if(!left&&ws&&ws.readyState===1&&Date.now()-lastRx>30000){try{ws.close();}catch(e){}}},5000);
    connect(true);
  });
}
/* ---- end transport ---- */
async function getRoom(){return {join:wsJoin};}
async function enter(create){
  me.name=$('nm').value.trim().replace(CTRL,'').slice(0,12);
  if(!me.name){msg('名前を入力してください');return;}
  let id='';
  if(create){const A='abcdefghjkmnpqrstuvwxyz23456789';for(let i=0;i<6;i++)id+=A[Math.floor(Math.random()*A.length)];}
  else{id=$('rid').value.trim().toLowerCase();if(!/^[a-z0-9]{4,12}$/.test(id)){msg('ルームIDは英数字4〜12文字です');return;}}
  $('mk').disabled=$('jn').disabled=true;msg('接続中…');
  try{
    const api=await getRoom();
    if(!api){msg('サーバーに接続できません。');return;}
    const r=await api.join(id);
    const a=Math.random()*6.2832;me.x=TX+Math.cos(a)*120*SC;me.y=TY+Math.sin(a)*70*SC;host=create;applyCfg();
    r.presence(snap()).catch(()=>{});
    if(!create){
      const found=await waitFor(()=>r.peers().some(p=>!p.sameTab&&p.presence&&p.presence.h===1),3500);
      if(!found){await r.leave();msg('ルームが見つかりません。IDを確認してください。');return;}
      const hp=r.peers().find(p=>p.presence&&p.presence.h===1);
      if(hp&&hp.presence.ph&&hp.presence.ph!=='lobby'){await r.leave();msg('ゲーム中のため入室できません。');return;}
      if(r.peers().filter(p=>p.presence&&p.presence.n).length>MAX){await r.leave();msg('このルームは満員です(最大20人)。');return;}
      const used=new Set(r.peers().filter(p=>!p.sameTab&&p.presence).map(p=>p.presence.c));
      if(used.has(me.color)){me.color=COLORS.find(k=>!used.has(k))||me.color;paintSw();}
    }
    R=r;code=id;save();sent={};
    $('join').hidden=true;$('game').hidden=false;$('rcode').textContent=code.toUpperCase();$('start').hidden=!host;$('tn').hidden=true;
    phase='lobby';role='';ids=[];spyIds=[];dead=new Set();bodies=[];meeting=null;pendingWin=null;myVote=null;
    chatOpen=false;unread=0;$('chat').hidden=true;$('log').textContent='';badge();setStatus('');
    R.presence(snap()).catch(()=>{});
    offChat=R.on('chat',onChat,()=>{});
    fit();tick();msg('');
  }catch(e){const c=e&&e.code;msg(c==='connect_failed'?'サーバーに接続できませんでした。時間をおいて、もう一度お試しください。':c==='full'?'このルームは満員です。':c==='bad_room'?'ルームIDが正しくありません。':'入室できませんでした（'+(c||'error')+'）');}
  finally{$('mk').disabled=$('jn').disabled=false;}
}
async function leave(){
  const r=R;R=null;if(offChat)offChat();offChat=null;others.clear();stick=null;
  phase='lobby';role='';ids=[];spyIds=[];dead=new Set();bodies=[];meeting=null;pendingWin=null;myVote=null;
  hideBig();closeMG();closeCfg();sabo=null;inVent=-1;$('tk').hidden=true;$('vote').hidden=true;$('act').hidden=true;$('chat').hidden=true;chatOpen=false;
  $('game').hidden=true;$('join').hidden=false;msg('');
  try{await r.leave();}catch(e){}
}

};

  const tg=nearestCrew();

  killCd=Date.now()+KILL_CD;
  R.emit('chat',{k:'kill',v:tg.id,b:'b'+tg.id.slice(0,8)+Date.now().toString(36),x:Math.round(tg.o.x),y:Math.round(tg.o.y),c:tg.o.c}).catch(()=>{});
};

  if(!R||phase!=='play'||amDead()||Date.now()<emCd||Math.hypot(me.x-TX,me.y-TY)>=ER)return;
  emCd=Date.now()+EM_CD;
  R.emit('chat',{k:'meet',b:null}).catch(()=>{});
};
$('start').onclick=async()=>{
  if(!R||!host)return;
  try{
    if(phase!=='lobby'){await R.emit('chat',{k:'reset'});return;}
    const pl=R.peers().filter(p=>p.presence&&p.presence.n).map(p=>p.peer);
    if(pl.length<3){flash('開始は3人からです');return;}
    const a=pl.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}
    await R.emit('chat',{k:'start',ids:pl,spies:a.slice(0,nSpies(pl.length)),cfg:CFG});
  }catch(e){flash(e&&e.code==='not_permitted'?'この権限では開始できません':'送信に失敗しました');}
};
